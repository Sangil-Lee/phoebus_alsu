# --------------------------------------
# Package org.phoebus.applications.git
# --------------------------------------

# Repository directory opened by default.
# May use system properties like "$(user.home)".
# Empty: Start without a repository, user selects one.
default_repository=

# Number of commits shown in the history
log_count=100

# Directory with SSH keys, known_hosts and config
ssh_directory=$(user.home)/.ssh

# Private key file for SSH.
# Empty: Use the default keys (id_rsa, id_ecdsa, id_ed25519, ...) in ssh_directory
# and IdentityFile entries of ssh_directory/config
ssh_private_key=

# Timeout in seconds for pull and push
remote_timeout=30

# Refresh automatically when files in the work tree or the repository change,
# and when the Git tab is selected or its window gets the focus
auto_refresh=true

# Check staged display and script files before a commit:
# Display files that cannot be read, references to missing files,
# Python syntax, PV names (see pv_name_pattern)
check_before_commit=true

# Regular expression that PV names in display files must match,
# checked before a commit. Empty: Do not check PV names.
# Example: [A-Z0-9]+(:[A-Za-z0-9_]+)+
pv_name_pattern=

# After a successful push, offer to create a logbook entry for the pushed commits
logbook_after_push=true

# Comma-separated logbooks and tags for new logbook entries.
# Empty: Use the logbook application's defaults
logbooks=
log_tags=

# Level of new logbook entries, for example 'Info'.
# Empty: Use the logbook application's default
log_level=

# Show the git state of files in the File Browser: modified, added, untracked, conflict, ignored,
# branch of repository directories
file_browser_decorations=true
