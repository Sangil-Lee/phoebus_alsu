# Phoebus site settings
#
# This is a copy of the reference file installed at /opt/phoebus/settings.ini,
# which install_phoebus.sh generates and /opt/phoebus/phoebus.sh passes with
# -settings. Change the installed file through the installer options
# (--config, --addr-list, --pv-default, ...) and refresh this copy from it :
#
#     cp /opt/phoebus/settings.ini phoebus-product/settings.ini
#
# To run from the build directory instead of the installed product :
#
#     cp phoebus-product/settings.ini phoebus-product/target/
#     cd phoebus-product/target && java -jar product-*.jar -settings settings.ini
#
# Every available property with its default value is in settings_template.ini.
#
#
# Settings of the installed Phoebus product, used by /opt/phoebus/phoebus.sh.
# Only the overridden properties are here, the complete list with the defaults
# is in phoebus-product/settings_template.ini of the source tree.

###################################################
# Package org.phoebus.applications.alarm
###################################################

# Kafka broker of the alarm system, the same one the alarm server publishes to
org.phoebus.applications.alarm/server=localhost:9092
org.phoebus.applications.alarm/kafka_properties=

# The alarm configuration, i.e. the Kafka topic
org.phoebus.applications.alarm/config_name=Accelerator
org.phoebus.applications.alarm/config_names=Accelerator

###################################################
# Package org.phoebus.applications.alarm.logging.ui
###################################################

# REST service of the alarm logger, used by the "Alarm Log Table"
org.phoebus.applications.alarm.logging.ui/service_uri=http://localhost:9000
org.phoebus.applications.alarm.logging.ui/results_max_size=10000

###################################################
# Package org.phoebus.pv and org.phoebus.pv.ca
###################################################

org.phoebus.pv/default=ca
org.phoebus.pv.ca/auto_addr_list=true
org.phoebus.pv.ca/addr_list=127.0.0.1 192.168.75.20 192.168.75.21 192.168.75.22 192.168.75.23 192.168.75.24 192.168.75.25 192.168.75.26 192.168.75.27 192.168.75.29 192.168.75.30 192.168.75.31
org.phoebus.pv.ca/server_port=5064
org.phoebus.pv.ca/repeater_port=5065
