# Phoebus site settings
#
# Only the properties this site overrides are listed here. Every available
# property with its default value is in phoebus-product/settings_template.ini,
# which create_settings_template.py regenerates from the source.
#
# Used by the product with
#     phoebus.sh -settings /path/to/settings.ini
#
# It lives next to settings_template.ini and not in target/, which .gitignore
# excludes and 'mvn clean' empties. Copy it into target/ to run from the build
# directory :
#     cp phoebus-product/settings.ini phoebus-product/target/
#
# The values below match what install_phoebus.sh deploys :
#     Kafka          localhost:9092   (KRaft, kafka.service)
#     Elasticsearch  localhost:9200   (elasticsearch.service)
#     alarm logger   localhost:9000   (phoebus-alarm-logger.service)

###################################################
# Package org.phoebus.applications.alarm
###################################################

# Kafka broker of the alarm system, the same one the alarm server publishes to
org.phoebus.applications.alarm/server=localhost:9092

# Extra Kafka client properties, none for a plain PLAINTEXT broker
org.phoebus.applications.alarm/kafka_properties=

# The alarm configuration, i.e. the Kafka topic. 'config_names' is what the
# user interface offers, 'config_name' is the one opened by default.
org.phoebus.applications.alarm/config_name=Accelerator
org.phoebus.applications.alarm/config_names=Accelerator

###################################################
# Package org.phoebus.applications.alarm.logging.ui
###################################################

# REST service of the alarm logger, used by the "Alarm Log Table"
org.phoebus.applications.alarm.logging.ui/service_uri=http://localhost:9000
org.phoebus.applications.alarm.logging.ui/results_max_size=10000

###################################################
# Package org.phoebus.pv and org.phoebus.pv.ca
###################################################

# Channel Access is the default protocol for PV names without a prefix
org.phoebus.pv/default=ca

# Channel Access address list. This machine keeps its IOCs on 192.168.75.x and
# runs test IOCs locally, so both are searched. auto_addr_list stays true so the
# broadcast addresses of the local interfaces are searched as well.
org.phoebus.pv.ca/addr_list=127.0.0.1 192.168.75.20 192.168.75.21 192.168.75.22 192.168.75.23 192.168.75.24 192.168.75.25 192.168.75.26 192.168.75.27 192.168.75.29 192.168.75.30 192.168.75.31
org.phoebus.pv.ca/auto_addr_list=true
org.phoebus.pv.ca/server_port=5064
org.phoebus.pv.ca/repeater_port=5065
